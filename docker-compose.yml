services:
  # Neon Database service
  neon-local:
    image: neondatabase/neon_local:latest
    ports:
      - '5432:5432'
    env_file:
      - ./.env.local
    profiles:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend service (Express.js)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount source for hot reload
      - ./src:/app/src
      # Preserve node_modules from container (don't override)
      - /app/node_modules
      # Mount dist if you want to see compiled output
      - ./dist:/app/dist
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    command: npm run dev
    stdin_open: true
    tty: true
    depends_on:
      neon-local:
        condition: service_healthy
    profiles:
      - dev

